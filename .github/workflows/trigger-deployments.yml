# file: .github/workflows/trigger-deployments.yml
# This workflow triggers deployments for the frontend, backend, and infrastructure based on changes in the dev or main branches.

name: Trigger Deployments

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:


permissions:
  id-token: write
  contents: read

jobs:
  detect:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.set.outputs.frontend }}
      backend: ${{ steps.set.outputs.backend }}
      infrastructure: ${{ steps.set.outputs.infrastructure }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:main

      - name: Detect Affected Projects
        id: detect
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$changed_files"

          frontend=false
          backend=false
          infrastructure=false

          if echo "$changed_files" | grep -q "^frontend/"; then frontend=true; fi
          if echo "$changed_files" | grep -q "^backend/"; then backend=true; fi
          if echo "$changed_files" | grep -q "^infrastructure/"; then infrastructure=true; fi

          echo "frontend=$frontend" >> $GITHUB_ENV
          echo "backend=$backend" >> $GITHUB_ENV
          echo "infrastructure=$infrastructure" >> $GITHUB_ENV

      - name: Set Outputs
        id: set
        run: |
          echo "frontend=${{ env.frontend }}" >> $GITHUB_OUTPUT
          echo "backend=${{ env.backend }}" >> $GITHUB_OUTPUT
          echo "infrastructure=${{ env.infrastructure }}" >> $GITHUB_OUTPUT

      - name: Set Deployment Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  infrastructure:
    name: Deploy Infrastructure
    if: ${{ needs.detect.outputs.infrastructure == 'true' }}
    needs: detect
    uses: ./.github/workflows/infrastructure.yml
    with:
      environment: ${{ needs.detect.outputs.environment }}
    secrets: inherit

  deploy_backend:
    name: Deploy Backend
    if: ${{ needs.detect.outputs.backend == 'true' }}
    needs: [detect, infrastructure]
    uses: ./.github/workflows/backend.yml
    with:
      environment: ${{ needs.detect.outputs.environment }}

  deploy_frontend:
    name: Deploy Frontend
    if: ${{ needs.detect.outputs.frontend == 'true' }}
    needs: [detect, infrastructure]
    uses: ./.github/workflows/frontend.yml
    with:
      environment: ${{ needs.detect.outputs.environment }}
