name: Trigger Deployments

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    name: Detect Affected Projects and Trigger Workflows
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      affected: ${{ steps.detect_affected.outputs.affected }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # required for full git diff

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Detect Affected Projects
        id: detect_affected
        run: |
          echo "Detecting changes against main..."
          changed_files=$(git diff --name-only origin/main...HEAD)
          echo "$changed_files"

          affected_projects="[]"

          if echo "$changed_files" | grep -q "^frontend/"; then
            affected_projects=$(echo "$affected_projects" | jq '. + ["frontend"]')
          fi

          if echo "$changed_files" | grep -q "^backend/"; then
            affected_projects=$(echo "$affected_projects" | jq '. + ["backend"]')
          fi

          if echo "$changed_files" | grep -q "^infrastructure/"; then
            affected_projects=$(echo "$affected_projects" | jq '. + ["infrastructure"]')
          fi

          echo "Affected projects: $affected_projects"
          echo "affected=$affected_projects" >> $GITHUB_OUTPUT

      - name: Trigger Infrastructure Workflow
        if: contains(fromJson(steps.detect_affected.outputs.affected), 'infrastructure')
        uses: actions/github-script@v6
        with:
          script: |
            const environment = context.ref === 'refs/heads/main' ? 'prod' : 'dev';
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'infrastructure.yml',
              ref: context.ref,
              inputs: { environment }
            });

      - name: Trigger Backend Workflow
        if: contains(fromJson(steps.detect_affected.outputs.affected), 'backend')
        uses: actions/github-script@v6
        with:
          script: |
            const environment = context.ref === 'refs/heads/main' ? 'prod' : 'dev';
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'backend.yml',
              ref: context.ref,
              inputs: { environment }
            });

      - name: Trigger Frontend Workflow
        if: contains(fromJson(steps.detect_affected.outputs.affected), 'frontend')
        uses: actions/github-script@v6
        with:
          script: |
            const environment = context.ref === 'refs/heads/main' ? 'prod' : 'dev';
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'frontend.yml',
              ref: context.ref,
              inputs: { environment }
            });
