name: Trigger Deployments

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      affected: ${{ steps.set-output.outputs.affected }}
      run_infrastructure: ${{ steps.set-output.outputs.run_infrastructure }}
      run_frontend: ${{ steps.set-output.outputs.run_frontend }}
      run_backend: ${{ steps.set-output.outputs.run_backend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full history so Nx can compare to main

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Install Dependencies
        run: npm ci

      - name: Detect Affected Projects
        id: detect
        run: |
          echo "Detecting affected apps..."
          npx nx show projects --affected --base=main --type=app > affected.json || echo '[]' > affected.json
          cat affected.json

      - name: Set Output
        id: set-output
        run: |
          affected=$(cat affected.json | jq -c)
          echo "affected=$affected" >> $GITHUB_OUTPUT

          run_infra=$(echo $affected | jq 'contains(["infrastructure"])')
          run_frontend=$(echo $affected | jq 'contains(["frontend"])')
          run_backend=$(echo $affected | jq 'contains(["backend"])')

          echo "run_infrastructure=$run_infra" >> $GITHUB_OUTPUT
          echo "run_frontend=$run_frontend" >> $GITHUB_OUTPUT
          echo "run_backend=$run_backend" >> $GITHUB_OUTPUT
        shell: bash

  infrastructure:
    name: Deploy Infrastructure
    if: ${{ fromJSON(needs.setup.outputs.run_infrastructure) }}
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Infrastructure Workflow
        uses: actions/github-script@v6
        with:
          script: |
            const environment = context.ref === 'refs/heads/main' ? 'prod' : 'dev';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'infrastructure.yml',
              ref: context.ref,
              inputs: { environment }
            });

  deploy:
    name: Deploy Affected Services
    if: ${{ fromJSON(needs.setup.outputs.run_frontend) || fromJSON(needs.setup.outputs.run_backend) }}
    needs: [setup, infrastructure] # ensure infra runs first (if needed)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
        include:
          - service: frontend
            should_run: ${{ fromJSON(needs.setup.outputs.run_frontend) }}
          - service: backend
            should_run: ${{ fromJSON(needs.setup.outputs.run_backend) }}
    steps:
      - name: Conditional Trigger for ${{ matrix.service }}
        if: matrix.should_run == true
        uses: actions/github-script@v6
        with:
          script: |
            const environment = context.ref === 'refs/heads/main' ? 'prod' : 'dev';
            const workflowMap = {
              frontend: 'frontend.yml',
              backend: 'backend.yml',
            };
            const workflow_id = workflowMap['${{ matrix.service }}'];
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              ref: context.ref,
              inputs: { environment }
            });
