name: Trigger Deployments

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.set.outputs.frontend }}
      backend: ${{ steps.set.outputs.backend }}
      infrastructure: ${{ steps.set.outputs.infrastructure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:main

      - name: Detect Affected Projects
        id: detect
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$changed_files"

          echo "frontend=false" >> $GITHUB_ENV
          echo "backend=false" >> $GITHUB_ENV
          echo "infrastructure=false" >> $GITHUB_ENV

          if echo "$changed_files" | grep -q "^frontend/"; then
            echo "frontend=true" >> $GITHUB_ENV
          fi
          if echo "$changed_files" | grep -q "^backend/"; then
            echo "backend=true" >> $GITHUB_ENV
          fi
          if echo "$changed_files" | grep -q "^infrastructure/"; then
            echo "infrastructure=true" >> $GITHUB_ENV
          fi

      - name: Set Boolean Outputs
        id: set
        run: |
          echo "frontend=${{ env.frontend }}" >> $GITHUB_OUTPUT
          echo "backend=${{ env.backend }}" >> $GITHUB_OUTPUT
          echo "infrastructure=${{ env.infrastructure }}" >> $GITHUB_OUTPUT

  infrastructure:
    name: Deploy Infrastructure
    if: ${{ needs.detect.outputs.infrastructure == 'true' }}
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Infrastructure
        run: echo "Running infrastructure deployment..." # Replace with your real deploy logic

  deploy:
    name: Deploy Frontend & Backend
    if: ${{ needs.detect.outputs.frontend == 'true' || needs.detect.outputs.backend == 'true' }}
    needs: [detect, infrastructure]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend]
        include:
          - project: frontend
            run: ${{ needs.detect.outputs.frontend == 'true' }}
          - project: backend
            run: ${{ needs.detect.outputs.backend == 'true' }}
    steps:
      - name: Deploy ${{ matrix.project }}
        if: matrix.run == true
        run: echo "Running ${{ matrix.project }} deployment..." # Replace with your real deploy logic
